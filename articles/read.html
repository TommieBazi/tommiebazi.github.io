<body>
<header><div class="wrap bar"><a class="brand" href="../"><span class="seal">八</span>Tommie BaZi</a><nav class="links"><a href="../#calc">ผูกดวงฟรี</a><a href="../#reel">วิดีโอแนะนำ</a><a href="./">บทความ</a><a href="../#services">บริการและราคา</a></nav><a class="btn" href="https://line.me/R/ti/p/@moo2moon" target="_blank" rel="noopener">ขอดูดวงของฉัน</a></div></header>
<main class="wrap">
  <article>
    <a class="back" href="./">← บทความทั้งหมด</a>
    <div class="eyebrow" id="date"></div>
    <h1 id="title">กำลังโหลด…</h1>
    <div id="cover"></div>
    <div class="prose" id="body"></div>
    <div class="cta"><h3 style="margin:0 0 8px">อยากรู้ว่าผังของคุณบอกอะไร</h3><p style="margin:0 0 16px;color:var(--soft)">ลองผูกดวงฟรี หรือทักไลน์ @moo2moon พร้อมวันเวลาเกิด</p><a class="btn" href="../#calc">ผูกดวงฟรี</a> &nbsp; <a class="btn" style="background:transparent;color:var(--text);border:1px solid var(--line)" href="https://line.me/R/ti/p/@moo2moon" target="_blank" rel="noopener">ทักไลน์</a></div>
  </article>
</main>
<footer><div class="wrap">Tommie BaZi · รับดูดวงจีนปาจื้อ สี่เสาหลักแห่งชะตา · LINE @moo2moon</div></footer>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('a') || '';
  var fail = function (m) { document.getElementById('title').textContent = m; };
  if (!/^[a-z0-9-]+$/.test(slug)) return fail('ไม่พบบทความ');
  fetch('index.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (list) {
    var a = list.filter(function (x) { return x.slug === slug; })[0]; if (!a) throw 0;
    document.title = a.title + ' · Tommie BaZi';
    document.getElementById('title').textContent = a.title;
    var d = new Date(a.date + 'T00:00:00'); document.getElementById('date').textContent = isNaN(d) ? '' : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
    if (a.cover) document.getElementById('cover').innerHTML = '<img class="cover" src="' + a.cover + '" alt="">';
    var m = document.querySelector('meta[name=description]') || document.head.appendChild(Object.assign(document.createElement('meta'), { name: 'description' })); m.content = a.excerpt || '';
    return fetch(slug + '.md', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.text(); });
  }).then(function (md) { document.getElementById('body').innerHTML = window.marked ? marked.parse(md) : '<p>' + md.replace(/[&<]/g, function (c) { return c === '&' ? '&amp;' : '&lt;'; }).replace(/\n\n/g, '</p><p>') + '</p>'; })
    .catch(function () { fail('ไม่พบบทความ'); });
})();
</script>
</body>
